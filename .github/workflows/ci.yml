name: CI

on:
  # El Issue #5 pide que se dispare en push a cualquier rama...
  push:
    branches: ['**']
  # ...y en PR hacia develop o main (necesario para que el check sea
  # requerido en la protección de rama).
  pull_request:
    branches: [develop, main]

# Una rama con PR abierta recibe dos eventos (push + pull_request).
# La clave es que ambos caigan en el MISMO grupo: `github.ref` no sirve
# porque vale `refs/heads/<rama>` en push pero `refs/pull/<n>/merge` en
# pull_request. `head_ref || ref_name` da el nombre de la rama en los dos
# casos, así el run duplicado se cancela en vez de gastar minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Caché de Turborepo: si no cambia el código de un paquete,
      # su tarea se resuelve desde caché en vez de reejecutarse.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build
